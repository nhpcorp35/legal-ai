name: HAL Calvagno Diagnostic Retry 3
on:
  push:
    branches: [main]
    paths: [.github/workflows/hal-calvagno-diagnostic-retry.yml]
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LEGALAI_MODEL_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt boto3
      - run: python scripts/run_verified_case_draft.py --case-id NY-Suffolk-600371-2021-DeSousa-v-Calvagno-II-Karcher
