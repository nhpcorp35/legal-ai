name: HAL Case-00 Q1
run-name: hal-case00-${{ inputs.question_id }}-${{ inputs.mission_id }}

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: Correlation ID supplied by HAL
        required: true
        type: string
      legalai_ref:
        description: Exact LegalAI commit SHA to execute
        required: true
        type: string
      authorization_confirmed:
        description: Confirms authorization to transmit private evidence to the model provider
        required: true
        default: false
        type: boolean
      benchmark_id:
        description: Benchmark identity supplied by the Bridge (must be Case-00-Triborough)
        required: true
        type: string
      question_id:
        description: Question identity supplied by the Bridge (must match Q[1-9][0-9]*)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hal-case00-${{ inputs.question_id }}-${{ inputs.mission_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LEGALAI_MODEL_TIMEOUT_SECONDS: "180"
      REQUIRED_COMMIT: ${{ inputs.legalai_ref }}
      BENCHMARK_ID: ${{ inputs.benchmark_id }}
      QUESTION_ID: ${{ inputs.question_id }}

    steps:
      - name: Initialize runner-local paths
        shell: bash
        run: |
          echo "CASE_ROOT=$RUNNER_TEMP/case00" >> "$GITHUB_ENV"
          echo "CANDIDATE_ROOT=$RUNNER_TEMP/case00-candidates" >> "$GITHUB_ENV"
          qid_lower="$(printf '%s' "$QUESTION_ID" | tr '[:upper:]' '[:lower:]')"
          echo "QUESTION_ID_LOWER=$qid_lower" >> "$GITHUB_ENV"
          echo "RESULT_JSON=case00-${qid_lower}-result.json" >> "$GITHUB_ENV"

      - name: Enforce bounded authorization, benchmark, question, and immutable SHA
        shell: bash
        run: |
          test "${{ inputs.authorization_confirmed }}" = "true"
          test "$BENCHMARK_ID" = "Case-00-Triborough"
          [[ "$QUESTION_ID" =~ ^Q[1-9][0-9]*$ ]] || exit 2
          case "$REQUIRED_COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              test "${#REQUIRED_COMMIT}" -eq 40
              ;;
            *)
              exit 2
              ;;
          esac

      - name: Check out exact LegalAI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.legalai_ref }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REQUIRED_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REQUIRED_COMMIT" origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt boto3 openai

      - name: Stage permitted question text
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          scripts_dir = Path("scripts").resolve()
          sys.path.insert(0, str(scripts_dir))
          import run_case00_b2_q1 as stage_cli

          question_id = os.environ["QUESTION_ID"]
          try:
              result = stage_cli.stage_question_from_canonical_b2_packet(
                  case_root=Path(os.environ["CASE_ROOT"]),
                  question_id=question_id,
              )
          except stage_cli.PacketStagingError as exc:
              # Never echo packet body or question text — safe metadata only.
              print(
                  json.dumps(
                      {
                          "ok": False,
                          "phase": "question_staging",
                          "blocker": exc.message,
                          **exc.details,
                      },
                      sort_keys=True,
                  )
              )
              raise SystemExit(1) from exc
          print(
              json.dumps(
                  {
                      "ok": True,
                      "phase": "question_staging",
                      "question_id": result["question_id"],
                      "object_key": result["object_key"],
                      "size": result["size"],
                      "sha256": result["sha256"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Compute Case-00 derived cache key
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          paths = (
              Path("data/case-00-triborough/nyscef_filing_inventory.json"),
              Path("matter_builder.py"),
              Path("complaint_structure.py"),
              Path("scripts/rebuild_case00_derived.py"),
          )
          digest = hashlib.sha256()
          for path in paths:
              digest.update(path.as_posix().encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")
          prefix = (
              "Benchmarks/Case-00-Triborough/derived/runtime-cache/"
              + digest.hexdigest()
              + "/"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DERIVED_CACHE_PREFIX={prefix}\n")
          PY

      - name: Restore and validate Case-00 derived cache from B2
        id: derived-cache
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import boto3
          from botocore.exceptions import ClientError

          scripts_dir = Path("scripts").resolve()
          sys.path.insert(0, str(scripts_dir))
          import rebuild_case00_derived as rebuild_cli

          root = Path(os.environ["CASE_ROOT"])
          prefix = os.environ["DERIVED_CACHE_PREFIX"]
          relative_paths = (
              Path("derived/page-extraction/canonical_page_records.json"),
              Path("derived/exhibit-segmentation/filing_exhibit_map.json"),
              Path("derived/case-map/case_map.json"),
              Path("derived/complaint-structure/complaint_structure_map.json"),
          )
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["B2_ENDPOINT"].rstrip("/"),
              region_name=os.environ["B2_REGION"],
              aws_access_key_id=os.environ["B2_KEY_ID"],
              aws_secret_access_key=os.environ["B2_APPLICATION_KEY"],
          )
          restored = []
          cache_hit = True
          for relative_path in relative_paths:
              destination = root / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              try:
                  rebuild_cli.download_b2_file(
                      client,
                      os.environ["B2_BUCKET"],
                      prefix + relative_path.as_posix(),
                      destination,
                  )
                  restored.append(destination)
              except ClientError as exc:
                  code = str(exc.response.get("Error", {}).get("Code", ""))
                  if code not in {"404", "NoSuchKey", "NotFound"}:
                      raise
                  cache_hit = False
                  break

          if cache_hit:
              report = rebuild_cli.validate_generator_inputs(
                  root,
                  inventory_path=Path(
                      "data/case-00-triborough/nyscef_filing_inventory.json"
                  ),
              )
              cache_hit = bool(report.get("ok"))

          if not cache_hit:
              for path in restored:
                  path.unlink(missing_ok=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cache_hit={str(cache_hit).lower()}\n")
          print(json.dumps({"cache_hit": cache_hit}, sort_keys=True))
          PY

      - name: Rebuild Case-00 derived cache
        if: ${{ steps.derived-cache.outputs.cache_hit != 'true' }}
        shell: bash
        run: |
          python scripts/rebuild_case00_derived.py \
            --case-root "$CASE_ROOT" \
            --b2-prefix

      - name: Publish and verify Case-00 derived cache in B2
        if: ${{ steps.derived-cache.outputs.cache_hit != 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import boto3

          root = Path(os.environ["CASE_ROOT"])
          prefix = os.environ["DERIVED_CACHE_PREFIX"]
          relative_paths = (
              Path("derived/page-extraction/canonical_page_records.json"),
              Path("derived/exhibit-segmentation/filing_exhibit_map.json"),
              Path("derived/case-map/case_map.json"),
              Path("derived/complaint-structure/complaint_structure_map.json"),
          )
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["B2_ENDPOINT"].rstrip("/"),
              region_name=os.environ["B2_REGION"],
              aws_access_key_id=os.environ["B2_KEY_ID"],
              aws_secret_access_key=os.environ["B2_APPLICATION_KEY"],
          )
          objects = []
          for relative_path in relative_paths:
              source = root / relative_path
              key = prefix + relative_path.as_posix()
              size = source.stat().st_size
              client.upload_file(str(source), os.environ["B2_BUCKET"], key)
              head = client.head_object(
                  Bucket=os.environ["B2_BUCKET"],
                  Key=key,
              )
              if head.get("ContentLength") != size:
                  raise SystemExit(f"Derived cache size mismatch: {relative_path}")
              objects.append({"key": key, "size": size})
          print(json.dumps({"verified": True, "objects": objects}, sort_keys=True))
          PY

      - name: Resolve and verify acceptance contract
        id: acceptance-contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          scripts_dir = Path("scripts").resolve()
          sys.path.insert(0, str(scripts_dir))
          import run_case00_b2_q1 as contract_cli

          try:
              result = contract_cli.resolve_and_verify_canonical_acceptance_contract(
                  benchmark_id=os.environ["BENCHMARK_ID"],
                  question_id=os.environ["QUESTION_ID"],
              )
          except contract_cli.AcceptanceContractConfigError as exc:
              # Never echo contract body — safe metadata / diagnostics only.
              print(
                  json.dumps(
                      {
                          "ok": False,
                          "phase": "acceptance_contract",
                          "blocker": exc.message,
                          **exc.details,
                      },
                      sort_keys=True,
                  )
              )
              raise SystemExit(1) from exc

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"object_key={result['object_key']}\n")
              output.write(f"content_sha256={result['content_sha256']}\n")
              output.write(f"benchmark_id={result['benchmark_id']}\n")
              output.write(f"question_id={result['question_id']}\n")
          print(
              json.dumps(
                  {
                      "ok": True,
                      "phase": "acceptance_contract",
                      "object_key": result["object_key"],
                      "content_sha256": result["content_sha256"],
                      "benchmark_id": result["benchmark_id"],
                      "question_id": result["question_id"],
                      "size": result["size"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Q2 production-boundary preflight
        id: q2-preflight
        shell: bash
        run: |
          set +e
          python scripts/q2_production_boundary_preflight.py \
            --fixture testdata/q2_production_boundary_31629603939_fixture.json \
            | tee "$RESULT_JSON"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Generate requested question and publish four verified artifacts to B2
        id: case00
        if: ${{ success() && steps.q2-preflight.outputs.ok == 'true' }}
        shell: bash
        run: |
          set +e
          python scripts/run_case00_b2_q1.py \
            --case-root "$CASE_ROOT" \
            --question-id "$QUESTION_ID" \
            --required-commit "$REQUIRED_COMMIT" \
            --candidate-output-root "$CANDIDATE_ROOT" \
            --authorization-confirmed \
            --generation-only \
            --reuse-derived \
            --acceptance-contract-object-key "${{ steps.acceptance-contract.outputs.object_key }}" \
            --acceptance-contract-content-sha256 "${{ steps.acceptance-contract.outputs.content_sha256 }}" \
            --acceptance-contract-benchmark-id "${{ steps.acceptance-contract.outputs.benchmark_id }}" \
            | tee "$RESULT_JSON"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload machine-readable run result
        if: ${{ always() && env.RESULT_JSON != '' && hashFiles(env.RESULT_JSON) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hal-case00-${{ env.QUESTION_ID_LOWER }}-${{ inputs.mission_id }}
          path: ${{ env.RESULT_JSON }}
          if-no-files-found: error
          retention-days: 7
