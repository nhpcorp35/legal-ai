name: Case-00 attorney packet validation

on:
  push:
    branches:
      - agent/case00-attorney-review-packet

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate syntax
        run: |
          python -m py_compile case00_attorney_eval/review_packet.py
          python -m py_compile scripts/run_case00_generate_and_evaluate.py
      - run: python -m unittest -v test_case00_attorney_review_packet.py
      - run: python -m unittest -v test_case00_generate_and_evaluate.py
      - run: python -m unittest -v test_case00_attorney_eval.py test_case00_diagnostics.py
