name: Diagnose Szymczyk draft archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-szymczyk-drafts.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
    steps:
      - run: python -m pip install boto3
      - name: Report non-sensitive draft object inventory
        run: |
          python - <<'PY'
          import json
          import os
          from collections import defaultdict

          import boto3

          case_id = "NY-NewYork-158068-2018-Szymczyk-v-Hudson-36-37"
          root = f"cases/{case_id}/derived/"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["B2_ENDPOINT"].rstrip("/"),
              region_name=os.environ["B2_REGION"],
              aws_access_key_id=os.environ["B2_KEY_ID"],
              aws_secret_access_key=os.environ["B2_APPLICATION_KEY"],
          )

          keys = []
          token = None
          while True:
              args = {"Bucket": os.environ["B2_BUCKET"], "Prefix": root, "MaxKeys": 1000}
              if token:
                  args["ContinuationToken"] = token
              page = client.list_objects_v2(**args)
              keys.extend(str(item.get("Key", "")) for item in page.get("Contents", []))
              if not page.get("IsTruncated"):
                  break
              token = page.get("NextContinuationToken")
              if not token:
                  raise RuntimeError("truncated listing without continuation token")

          request_ids = sorted(
              key.rsplit("/", 1)[-1].removesuffix(".json")
              for key in keys
              if "/draft-requests/" in key and key.endswith(".json")
          )
          artifacts = defaultdict(set)
          for key in keys:
              marker = "/internal-drafts/"
              if marker not in key:
                  continue
              suffix = key.split(marker, 1)[1]
              parts = suffix.split("/", 1)
              if len(parts) == 2:
                  artifacts[parts[0]].add(parts[1])

          print(f"draft_request_count={len(request_ids)}")
          print("draft_request_ids=" + ",".join(request_ids))
          print(f"internal_draft_count={len(artifacts)}")
          request_prefix = f"cases/{case_id}/derived/draft-requests/"
          for request_id in request_ids:
              raw = client.get_object(
                  Bucket=os.environ["B2_BUCKET"],
                  Key=f"{request_prefix}{request_id}.json",
              )["Body"].read()
              item = json.loads(raw.decode("utf-8"))
              print(
                  request_id
                  + ":schema=" + str(item.get("schema_version"))
                  + ",case_match=" + str(item.get("case_id") == case_id).lower()
                  + ",request_status=" + str(item.get("status"))
                  + ",external_false=" + str(item.get("external_communication") is False).lower()
                  + ",question_valid=" + str(isinstance(item.get("question"), str)).lower()
                  + ",requester_valid=" + str(isinstance(item.get("requested_by"), str)).lower()
                  + ",created_valid=" + str(isinstance(item.get("created_at"), int)).lower()
                  + ",bytes=" + str(len(raw))
              )
          for request_id in sorted(artifacts):
              names = artifacts[request_id]
              print(
                  request_id
                  + ":request=" + str(request_id in request_ids).lower()
                  + ",status=" + str("status.json" in names).lower()
                  + ",draft=" + str("draft.json" in names).lower()
                  + ",discarded=" + str("discarded.json" in names).lower()
              )
          PY
