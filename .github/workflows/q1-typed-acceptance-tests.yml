name: Q1 typed acceptance claims tests

on:
  pull_request:
    paths:
      - "acceptance_contract/**"
      - "engines/drafting_engine.py"
      - "scripts/generate_attorney_feedback_candidate.py"
      - "test_acceptance_contract.py"
      - "test_q1_typed_acceptance_claims.py"
      - "test_q1_typed_claim_builder.py"
      - "test_party_role_procedural_synthesis.py"
      - "test_party_role_evidence_completeness.py"
      - ".github/workflows/q1-typed-acceptance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema openai boto3
      - name: Run typed Q1 and acceptance tests
        run: |
          python -m unittest             test_q1_typed_acceptance_claims.py             test_q1_typed_claim_builder.py             test_acceptance_contract.py             test_party_role_procedural_synthesis.py             test_party_role_evidence_completeness.py             -v
