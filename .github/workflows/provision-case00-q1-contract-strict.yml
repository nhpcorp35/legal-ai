name: Provision Case-00 Q1 acceptance contract strict

on:
  workflow_dispatch:
    inputs:
      authorization_confirmed:
        description: Authorization to transmit the private Q1 benchmark section to the configured model provider
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce authorization and main ancestry
        run: |
          test "${{ inputs.authorization_confirmed }}" = "true"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check boto3 openai
      - name: Derive, validate, publish, and authenticate Q1 contract
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/provision_case00_q1_acceptance_contract_strict.py --authorization-confirmed
