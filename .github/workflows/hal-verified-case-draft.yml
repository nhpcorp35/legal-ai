name: HAL Verified Case Internal Draft
run-name: verified-draft-${{ inputs.case_id }}-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      case_id:
        required: true
        type: string
      request_id:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verified-draft-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LEGALAI_MODEL_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt boto3
      - name: Generate bounded internal draft
        env:
          CASE_ID: ${{ inputs.case_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [ -n "$REQUEST_ID" ]; then
            python scripts/run_verified_case_draft.py --case-id "$CASE_ID" --request-id "$REQUEST_ID"
          else
            python scripts/run_verified_case_draft.py --case-id "$CASE_ID"
          fi
