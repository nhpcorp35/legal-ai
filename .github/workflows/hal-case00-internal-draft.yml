name: HAL Case-00 Internal Draft
run-name: case00-draft-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id: {required: true, type: string}
permissions: {contents: read}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt boto3
      - run: python scripts/run_case00_internal_draft.py --request-id '${{ inputs.request_id }}'
