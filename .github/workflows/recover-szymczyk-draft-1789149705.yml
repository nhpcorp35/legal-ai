# One-time, non-sensitive status diagnostic for draft-1789149705-ad4d36ce40a0.
name: Diagnose Szymczyk internal draft

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-szymczyk-draft-1789149705.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install boto3
      - name: Read status metadata only
        run: |
          python - <<'PY'
          import json, os
          import boto3
          from botocore.exceptions import ClientError
          case_id = "NY-NewYork-158068-2018-Szymczyk-v-Hudson-36-37"
          request_id = "draft-1789149705-ad4d36ce40a0"
          client = boto3.client("s3", endpoint_url=os.environ["B2_ENDPOINT"].rstrip("/"), region_name=os.environ["B2_REGION"], aws_access_key_id=os.environ["B2_KEY_ID"], aws_secret_access_key=os.environ["B2_APPLICATION_KEY"])
          base = f"cases/{case_id}/derived/internal-drafts/{request_id}"
          for name in ("status.json", "draft.json"):
              try:
                  raw = client.get_object(Bucket=os.environ["B2_BUCKET"], Key=f"{base}/{name}")["Body"].read()
              except ClientError as exc:
                  print(f"{name}=missing:{((exc.response or {}).get('Error') or {}).get('Code','unknown')}")
                  continue
              print(f"{name}=present")
              if name == "status.json":
                  value = json.loads(raw.decode("utf-8"))
                  print("status=" + str(value.get("status", "invalid")))
          PY
