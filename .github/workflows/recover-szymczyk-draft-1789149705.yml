# This one-time recovery trigger exists only to process request draft-1789149705-ad4d36ce40a0.
name: Recover Szymczyk internal draft

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-szymczyk-draft-1789149705.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LEGALAI_MODEL_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt boto3
      - name: Recover the existing request exactly once
        run: python scripts/run_verified_case_draft.py --case-id NY-NewYork-158068-2018-Szymczyk-v-Hudson-36-37 --request-id draft-1789149705-ad4d36ce40a0
