name: LegalAI Production Release
run-name: legalai-release-${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - app.py
      - Procfile
      - requirements.txt
      - railway.toml
      - Dockerfile
      - scripts/**
      - static/**
      - templates/**
      - test_*.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legalai-production-release
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: 1af7b0c8-f363-4154-89f2-cd79a6dfaf5c
  RAILWAY_ENVIRONMENT_ID: eccbb432-342b-415b-88e3-fc083d7cfe59

jobs:
  test:
    name: Test verified LegalAI code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Railway CLI for read-only verified-record preflight
        run: npm install --global @railway/cli@5.62.1
      - run: python -m py_compile app.py scripts/run_verified_case_draft.py
      - run: python -m unittest -v test_release_controller_contract test_release_smoke
      - name: Replay Rennick verified-record retrieval without a model
        env:
          CASE_ID: NY-Nassau-613561-2026-Desousa-v-Rennick
        run: |
          railway run --no-local --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service legal-ai-executor -- python - <<'PY'
          import json

          from scripts.run_verified_case_draft import (
              classify_page,
              client,
              evidence,
              load_reviewed_authorities,
          )

          case_id = __import__("os").environ["CASE_ID"]
          s3 = client()
          authorities = load_reviewed_authorities(s3, case_id)
          assert len(authorities) == 10, {"authority_count": len(authorities)}

          checks = {}
          for kind, question in {
              "motion_recommendation": "I need to make a motion. Which motions should I consider?",
              "motion_response": "My opponent made a motion. How should I answer it?",
          }.items():
              pages = list(evidence(s3, case_id, question))
              filenames = [page["filename"] for page in pages]
              source_types = sorted({classify_page(page)["source_type"] for page in pages})
              assert any("ORDER_TO_SHOW_CAUSE_32" in name for name in filenames), filenames
              assert any("EXHIBIT_S__27" in name for name in filenames), filenames
              assert {
                  "expert_opinion",
                  "regulatory_record",
                  "visual_or_measurement_evidence",
              }.issubset(source_types), source_types
              checks[kind] = {
                  "selected_page_count": len(pages),
                  "source_types": source_types,
                  "doc32_selected": True,
                  "nysdec_exhibit_selected": True,
              }

          print(json.dumps({
              "result": "RENNICK_RETRIEVAL_PREFLIGHT_VERIFIED",
              "model_called": False,
              "draft_created": False,
              "b2_write": False,
              "authority_count": len(authorities),
              "checks": checks,
          }, sort_keys=True))
          PY

  deploy:
    name: Deploy and verify production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.62.1
      - name: Queue application service deployment
        run: railway up --detach --project "$RAILWAY_PROJECT_ID" --environment production --service legal-ai-executor
      - name: Queue draft worker deployment
        run: railway up --detach --project "$RAILWAY_PROJECT_ID" --environment production --service internal-draft-worker
      - name: Verify both services reached a terminal success state
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time

          services = ("legal-ai-executor", "internal-draft-worker")
          deadline = time.monotonic() + 600
          while time.monotonic() < deadline:
              receipts = {}
              for service in services:
                  result = subprocess.run(
                      ["railway", "deployment", "list", "--service", service, "--environment", "production", "--json", "--limit", "1"],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  records = json.loads(result.stdout)
                  if isinstance(records, dict):
                      records = records.get("deployments", [])
                  if not records:
                      raise SystemExit("No Railway deployment receipt for " + service)
                  receipts[service] = records[0]
              statuses = {service: receipt.get("status") for service, receipt in receipts.items()}
              if all(status == "SUCCESS" for status in statuses.values()):
                  print(json.dumps({"railway_receipts": receipts}, sort_keys=True))
                  break
              if any(status in {"FAILED", "CRASHED", "REMOVED"} for status in statuses.values()):
                  raise SystemExit("Railway deployment failed: " + json.dumps(statuses, sort_keys=True))
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for Railway deployment")
          PY

  notify:
    name: Send verified release receipt
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify Pushover
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          RELEASE_RESULT: ${{ needs.deploy.result }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 \
            --form-string "token=${PUSHOVER_APP_TOKEN}" \
            --form-string "user=${PUSHOVER_USER_KEY}" \
            --form-string "title=LegalAI release ${RELEASE_RESULT}" \
            --form-string "message=Commit ${GITHUB_SHA} · tests=${{ needs.test.result }} · deployment=${RELEASE_RESULT}" \
            https://api.pushover.net/1/messages.json
